<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Boss" />
<title>Boss Fight</title>
<style>
:root{--bg:#05070b;--card:#0b0f17;--line:rgba(255,255,255,.09);--text:#fff;--muted:rgba(255,255,255,.72);--dim:rgba(255,255,255,.5);--hot:#ff5f5f;--warm:#ff9f1c;--revert:#d93b3b;--flip-ms:1100ms;--hold-ms:600ms;--gap:10px;--radius:20px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{width:100vw;height:100vh;height:100dvh}
.scene{position:fixed;inset:0;padding:calc(var(--gap) + var(--safe-top)) calc(var(--gap) + var(--safe-right)) calc(var(--gap) + var(--safe-bottom)) calc(var(--gap) + var(--safe-left));perspective:1800px;background:var(--bg)}
/* Symmetric easing keeps the edge-on moment at exactly half the duration,
   which is when the faces swap visibility. */
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform var(--flip-ms) cubic-bezier(.45,0,.55,1);cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card.is-flipped{transform:rotateY(180deg)}
.card:focus-visible .face{box-shadow:0 0 0 2px var(--warm),0 18px 40px rgba(0,0,0,.55)}
.face{position:absolute;inset:0;overflow:hidden;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.55);-webkit-backface-visibility:hidden;backface-visibility:hidden;isolation:isolate}
.face.back{transform:rotateY(180deg)}
/* Belt and braces for Safari, where <video> can ignore backface-visibility:
   the hidden face is swapped out at the midpoint, when both faces are edge-on. */
.card.show-back .front,.card:not(.show-back) .back{visibility:hidden}

/* Front: the live boss video */
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:var(--bg);display:block;opacity:0;filter:saturate(calc(1 - var(--d,0) * .35)) contrast(calc(1 + var(--d,0) * .18)) brightness(calc(1 - var(--d,0) * .12));transition:opacity 1200ms linear,filter 600ms ease;will-change:opacity;pointer-events:none;z-index:0}
.hero-video.is-active{opacity:1}
.hud-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:6;pointer-events:none}
.metric.right{text-align:right}
.label{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 4px rgba(0,0,0,.85)}
.value{margin-top:3px;font-weight:850;letter-spacing:-.02em;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.value.boss-name{font-size:clamp(15px,5vw,21px);max-width:60vw;line-height:1.1}
.value.level-num{font-size:clamp(23px,6.5vw,31px);line-height:1}
.hud-bottom{position:absolute;left:12px;right:12px;bottom:14px;z-index:6;pointer-events:none}
.hp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.hp-num{font-size:12px;font-weight:850;letter-spacing:-.01em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
.hp-track{width:100%;height:7px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.18)}
.hp-fill{width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--hot),var(--warm));transition:width 300ms ease}

/* Back: attack pad and score card */
.back{display:flex;flex-direction:column;padding:14px 14px 10px;background:radial-gradient(120% 70% at 50% 0%,rgba(255,95,95,.16),transparent 60%),linear-gradient(180deg,#111624,#080b12)}
.back .label{text-shadow:none}
.sc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sc-title{font-size:clamp(17px,5.4vw,23px);font-weight:850;letter-spacing:-.02em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-hp{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.back .hp-track{margin-top:8px;height:6px}
.hero-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px}
.hero-hp{font-size:11px;font-weight:800;color:#ffd0d0;font-variant-numeric:tabular-nums}
.back .hero-track{margin-top:4px;height:4px}
.hero-fill{background:linear-gradient(90deg,#ff8f8f,#ffd0d0)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;padding:3px;border-radius:11px;background:rgba(255,255,255,.06)}
.tab{border:0;margin:0;padding:7px 0;border-radius:8px;background:transparent;color:var(--dim);font:inherit;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tab[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
.panel{flex:1;min-height:0;display:flex;flex-direction:column}
.panel[hidden],.tiles[hidden],.group-label[hidden],.hero-line[hidden],.hp-track[hidden]{display:none}
.pad{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:12px}
.group-label{margin:12px 2px 6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* Pad sections in the order of the day (Morning, Day, Evening, from the
   habit's Section in Notion), then Weekly, bad habits and workouts. A tap on a
   header folds the section away; the count still shows what is done today (or
   this week). */
.sec[hidden]{display:none}
.sec-head{display:flex;align-items:center;gap:8px;width:100%;margin:12px 0 6px;padding:2px;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.sec-head .label{flex:1}
.sec-count{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-count.all{color:#7dffb0}
.sec-count.slip{color:#ff8f8f}
.chev{flex:none;width:7px;height:7px;margin:0 4px 3px 2px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform 200ms ease}
.sec.collapsed .chev{transform:rotate(-45deg);margin-bottom:0}
.sec.collapsed .tiles{display:none}
.sec.collapsed .sec-head{margin-bottom:0}
.tile{position:relative;overflow:hidden;display:grid;grid-template-columns:32px 1fr;align-items:center;gap:9px;width:100%;min-height:52px;padding:7px 10px 7px 8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:var(--text);font:inherit;text-align:left;cursor:pointer;touch-action:pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tier,var(--line))}
.tile-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--tier-bg,rgba(255,255,255,.08));font-size:16px;line-height:1}
.tile-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.tile-top{display:flex;align-items:center;gap:6px;min-width:0}
.tile-name{flex:1;min-width:0;font-size:12.5px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-sub{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.tile-since{flex:1;min-width:0;font-size:10px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-since b{font-weight:850;color:var(--muted)}
.tile.hero .tile-since b{color:#ffd0d0}
.tile-last{min-width:0;font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-last[hidden]{display:none}
.tile-last .lvl{color:var(--tier)}
.tile-last .sp{margin-left:5px;padding:1px 5px;border-radius:5px;background:rgba(255,211,90,.18);color:#ffd35a;font-size:8.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.tile.fresh{border-color:rgba(255,159,28,.55);box-shadow:0 0 0 1px rgba(255,159,28,.25) inset}
.tile .charge{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,transparent,var(--tier,var(--warm)));opacity:.3;pointer-events:none}
.tile.is-charging .charge{width:100%;transition:width var(--hold-ms) linear}
.tile.is-charging{transform:scale(.98);transition:transform 120ms ease}
/* A tap answers at once: the tile punches and flashes, reads "now", and a
   light sweeps its bottom edge until Battle's reply brings the damage. Taps
   on other tiles meanwhile wait their turn under a QUEUED chip. */
.tile.strike{animation:strike 280ms ease-out}
.tile.strike .charge{width:100%;animation:burst 520ms ease-out forwards}
@keyframes strike{0%{transform:scale(.95)}45%{transform:scale(1.03)}100%{transform:none}}
@keyframes burst{0%{opacity:.75}100%{opacity:0}}
.tile.is-sending::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--tier,var(--warm)),transparent) no-repeat;background-size:50% 100%;animation:sweep 900ms linear infinite}
@keyframes sweep{from{background-position:-100% 0}to{background-position:200% 0}}
.tile-queued{flex:none;padding:1px 5px;border-radius:5px;font-size:8.5px;font-weight:900;letter-spacing:.08em;color:var(--dim);border:1px dashed rgba(255,255,255,.3)}
.tile:not(.is-queued) .tile-queued{display:none}
#workoutTiles .tile-last{font-size:9.5px}
.pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;letter-spacing:-.02em;color:var(--warm);text-shadow:0 2px 10px rgba(0,0,0,.8);pointer-events:none;animation:pop 1100ms ease-out forwards;white-space:nowrap}
.pop.crit{color:var(--hot);font-size:26px}
.pop.hurt{color:#ff8f8f}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stat{padding:8px 6px 7px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);text-align:center;min-width:0}
.stat-num{font-size:clamp(16px,5vw,21px);font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .label{margin-top:3px;font-size:7.5px;color:var(--dim)}
.log-head{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 2px}
.filters{display:flex;gap:4px}
.chip{border:1px solid var(--line);margin:0;padding:4px 10px;border-radius:999px;background:transparent;color:var(--dim);font:inherit;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.day{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 5px;border-bottom:1px solid var(--line);background:#0c101a}
.day-sum{font-size:10px;font-weight:800;color:var(--warm);font-variant-numeric:tabular-nums}
.day-sum .you{color:#ff8f8f}
.log{flex:1;min-height:0;margin:0;padding:0;list-style:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent)}
.log>li:last-child{margin-bottom:18px}
.row{position:relative;overflow:hidden;border-bottom:1px solid var(--line);transition:height 260ms ease,opacity 260ms ease}
.row:last-child{border-bottom:0}
.row.is-gone{opacity:0}
.row-action{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;border:0;margin:0;background:var(--revert);color:#fff;font:inherit;font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;visibility:hidden}
.row.is-swiping .row-action,.row.is-open .row-action,.row.is-busy .row-action{visibility:visible}
.hit{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:9px 4px;touch-action:pan-y;transition:transform 220ms ease}
.row.is-swiping .hit,.row.is-open .hit,.row.is-busy .hit{background:#0d111b}
.row.is-swiping .hit{transition:none}
.hit-name{font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit-when{grid-column:1;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.hit-dmg{grid-column:2;grid-row:1/span 2;text-align:right;font-size:18px;font-weight:850;letter-spacing:-.02em;color:var(--warm);font-variant-numeric:tabular-nums}
.hit-dmg small{display:block;font-size:10px;font-weight:700;letter-spacing:0;color:var(--dim)}
.row.crit .hit-dmg{color:var(--hot)}
.row.hurt .hit-dmg{color:#ff8f8f}
.row.hurt .hit-name::before{content:'';display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:#ff8f8f;vertical-align:2px}
.crit-tag{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:5px;background:rgba(255,95,95,.18);color:var(--hot);font-size:9px;font-weight:850;letter-spacing:.08em;vertical-align:2px}
.empty{padding:28px 4px;text-align:center;color:var(--dim);font-size:13px}
.hint{margin-top:6px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.32)}
.toast{position:absolute;left:14px;right:14px;bottom:30px;z-index:5;padding:10px 12px;border-radius:12px;background:rgba(20,24,34,.97);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px;font-weight:650;line-height:1.35;text-align:center;white-space:pre-line;opacity:0;transform:translateY(8px);transition:opacity 200ms ease,transform 200ms ease;pointer-events:none}
.toast.is-shown{opacity:1;transform:none}
.toast.is-error{border-color:rgba(255,95,95,.5)}

/* Attack rows show how hard a hit lands: tier colour and a 3-segment meter,
   from the habit's base damage (before the level multiplier). No numbers on purpose. */
.meter{display:inline-flex;gap:3px;flex:none}
.meter[hidden]{display:none}
.meter i{display:block;width:12px;height:5px;border-radius:2px;background:rgba(255,255,255,.12)}
.tiles .meter{gap:2px}
.tiles .meter i{width:8px}
.tile.t1 .meter i:nth-child(-n+1),.tile.t2 .meter i:nth-child(-n+2),.tile.t3 .meter i:nth-child(-n+3){background:var(--tier);box-shadow:0 0 6px var(--tier-bg)}
.tile.t1{--tier:#8fc3ff;--tier-bg:rgba(120,180,255,.18)}
.tile.t2{--tier:#ffb547;--tier-bg:rgba(255,170,60,.2)}
.tile.t3{--tier:#ff6a3d;--tier-bg:rgba(255,106,61,.24);background:linear-gradient(100deg,rgba(255,106,61,.1),rgba(255,255,255,.03) 60%)}
.tile.hero{background:rgba(255,95,95,.05)}
.tile.hero.t1{--tier:#ffb0b0;--tier-bg:rgba(255,95,95,.14)}
.tile.hero.t2{--tier:#ff8080;--tier-bg:rgba(255,95,95,.2)}
.tile.hero.t3{--tier:#ff4d4d;--tier-bg:rgba(255,60,60,.26);background:linear-gradient(100deg,rgba(255,60,60,.12),rgba(255,255,255,.03) 60%)}
/* KO: this attack can finish the boss (solid: every roll does, outline: a good roll does) */
.ko{flex:none;padding:1px 5px;border-radius:5px;font-size:9px;font-weight:900;letter-spacing:.08em;color:#ffd35a;border:1px solid rgba(255,211,90,.7);background:rgba(20,16,4,.6)}
.ko[hidden]{display:none}
.tile.ko-sure .ko{background:#ffd35a;color:#1a1200;border-color:#ffd35a}
.tile.ko-maybe,.tile.ko-sure{--tier:#ffd35a;border-color:rgba(255,211,90,.55);box-shadow:0 0 14px rgba(255,211,90,.18)}
/* Streak: consecutive days with a hit. Lit once today's is in, dashed while it
   still needs today's hit, and glowing once it pays a damage bonus (3+ days). */
.streak{flex:none;padding:0 4px;border-radius:5px;font-size:9px;line-height:13px;font-weight:900;color:#ffb547;background:rgba(255,140,40,.12);border:1px solid rgba(255,160,60,.4);font-variant-numeric:tabular-nums;white-space:nowrap}
.streak[hidden]{display:none}
.streak.risk{opacity:.6;border-style:dashed}
.streak.paying{color:#1a1000;background:linear-gradient(90deg,#ffd35a,#ff9f1c);border-color:transparent;box-shadow:0 0 10px rgba(255,160,40,.45)}
/* Training header: power level, form and this week, from the Strava effort scores */
.power{margin:10px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(120deg,rgba(125,255,176,.06),rgba(255,255,255,.02))}
.power[hidden]{display:none}
.pl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;font-weight:800;letter-spacing:.02em;color:#7dffb0;text-shadow:0 0 12px rgba(125,255,176,.35);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl small{margin-left:6px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-shadow:none}
.form-chip{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:850;letter-spacing:.04em;white-space:nowrap;background:rgba(255,255,255,.08);color:var(--dim)}
.form-chip.steady{background:rgba(120,180,255,.16);color:#a9d2ff}
.form-chip.building{background:rgba(125,255,176,.16);color:#7dffb0}
.form-chip.overreaching{background:rgba(255,95,95,.18);color:#ff9a9a}
.week{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:10.5px;font-weight:750;color:var(--muted)}
.week > span:first-child{min-width:0;line-height:1.35}
.dots{display:flex;gap:4px;flex:none}
.dots i{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.06);font-style:normal;font-size:7.5px;font-weight:850;color:var(--dim)}
.dots i.on{background:#7dffb0;color:#04210f}
.dots i.today{box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.power-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.power-meta b{color:#ffb547;font-weight:900}
.power-note{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.power-note b{color:#ffb547;font-weight:900}
.front .power-mult{margin-top:3px;font-size:9px;font-weight:850;letter-spacing:.1em;color:#ffb547;text-shadow:0 1px 4px rgba(0,0,0,.85)}

/* Victory: the boss died in combat. Shown until the victory is claimed, then
   'summoning' until Boss Spawn publishes the next fight. */
.front.won .hero-video{filter:grayscale(.85) brightness(.45) contrast(1.05)}
.front.won .fx:not(.fx-flash){opacity:0 !important;animation:none !important}
.front.won .hud-bottom{opacity:0}
.victory{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:24px 18px;text-align:center;background:radial-gradient(90% 55% at 50% 42%,rgba(255,196,60,.26),rgba(5,7,11,.55) 60%,rgba(5,7,11,.88));opacity:0;animation:victoryIn 900ms ease-out 700ms forwards}
.victory[hidden]{display:none}
@keyframes victoryIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.v-panel{width:100%;max-width:340px}
.v-kicker{font-size:10px;font-weight:850;letter-spacing:.3em;text-transform:uppercase;color:#ffd35a}
.v-title{margin-top:6px;font-size:clamp(46px,15vw,64px);font-weight:900;letter-spacing:.04em;line-height:1;text-transform:uppercase;background:linear-gradient(180deg,#fff6d6,#ffd35a 45%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,180,40,.45))}
.victory.summoning .v-title{font-size:clamp(24px,7.5vw,32px);line-height:1.1}
.v-boss{margin-top:10px;font-size:15px;font-weight:800;color:#fff;line-height:1.35}
.v-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.v-stat{padding:8px 4px 7px;border-radius:12px;background:rgba(0,0,0,.38);border:1px solid rgba(255,211,90,.2)}
.v-stat b{display:block;font-size:17px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.v-stat span{font-size:7.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.v-final{margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
.v-btn{margin-top:20px;width:100%;padding:15px 12px;border:0;border-radius:14px;background:linear-gradient(90deg,#ffd35a,#ff9f1c);color:#1a1000;font:inherit;font-size:14px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 28px rgba(255,170,40,.35);animation:vpulse 2.2s ease-in-out infinite}
.v-btn:disabled{opacity:.6;animation:none}
@keyframes vpulse{50%{box-shadow:0 8px 40px rgba(255,190,60,.65)}}
.v-note{margin-top:9px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--dim)}
.v-orb{display:none;margin:22px auto 4px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,#fff6d6,#ffb547 40%,rgba(255,120,40,0) 70%);animation:orb 1.6s ease-in-out infinite}
@keyframes orb{50%{transform:scale(1.25);opacity:.7}}
.victory.summoning .v-stats,.victory.summoning .v-final,.victory.summoning .v-btn{display:none}
.victory.summoning .v-orb{display:block}
/* Stuck: no new boss 21 minutes after the claim, so the spawn most likely failed. */
.victory.summoning.stuck .v-btn{display:block}
.victory.summoning.stuck .v-orb{animation:none;opacity:.35}

/* Lore: the boss's epithet under its name on the front, the full story on the back */
.epithet{margin-top:3px;font-size:10px;font-weight:750;letter-spacing:.06em;color:#ffc680;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.epithet:empty{display:none}
.lore{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 4px 12px}
.lore-epithet{font-size:10px;font-weight:850;letter-spacing:.24em;text-transform:uppercase;color:#ffb547}
.lore-name{margin-top:6px;font-size:clamp(24px,7.5vw,30px);font-weight:900;letter-spacing:-.02em;line-height:1.1}
.lore-text{margin:14px 0 0;font-size:15px;font-weight:500;line-height:1.6;color:var(--muted)}
.lore-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.lore-facts span{padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* Hall of Fame: every boss beaten in combat, newest first */
.hall{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 0}
.hall-sum{margin:0 2px 10px;font-size:9px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.hall-sum b{color:#ffd35a}
.hall-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.trophy{display:grid;grid-template-columns:66px 1fr;gap:12px;padding:8px;border:1px solid rgba(255,211,90,.22);border-radius:14px;background:linear-gradient(120deg,rgba(255,211,90,.08),rgba(255,255,255,.02) 55%)}
.trophy-img{width:66px;height:88px;border-radius:9px;object-fit:cover;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,211,90,.35)}
.trophy-body{min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:2px}
.trophy-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.trophy-name{min-width:0;font-size:16px;font-weight:900;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trophy-lv{flex:none;font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#ffd35a}
.trophy-epithet{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffb547}
.trophy-epithet:empty{display:none}
.trophy-stats{margin-top:3px;font-size:11px;font-weight:750;color:var(--muted);font-variant-numeric:tabular-nums}
.trophy-line{font-size:10.5px;font-weight:700;color:var(--dim)}
.trophy-line b{color:var(--muted);font-weight:850}
@media(prefers-reduced-motion:reduce){.victory{animation:none;opacity:1}.v-btn,.v-orb{animation:none}}

/* Damage overlay: the front shows how hurt the boss is. --d runs from 0 at
   full HP to 1 at 0 HP; stage-2 is 26-60% HP, stage-3 is 25% or less. */
.fx{position:absolute;inset:0;pointer-events:none}
.fx-vignette{z-index:2;background:radial-gradient(ellipse 75% 65% at 50% 45%,transparent 40%,rgba(160,0,0,.55) 78%,rgba(90,0,0,.9) 100%);opacity:calc(var(--d,0) * var(--d,0) * 1.1);transition:opacity 600ms ease}
.front.stage-3 .fx-vignette{animation:heartbeat 1.6s infinite}
@keyframes heartbeat{0%,100%{filter:brightness(1)}12%{filter:brightness(1.6)}24%{filter:brightness(1.05)}36%{filter:brightness(1.45)}60%{filter:brightness(1)}}
/* The boss's power wavers: short dark dips over the video */
.fx-flicker{z-index:2;background:#000;opacity:0}
.front.stage-3 .fx-flicker{animation:waver 3.2s infinite}
@keyframes waver{0%,46%,50%,55%,100%{opacity:0}48%{opacity:.22}53%{opacity:.14}}
.fx-cracks{z-index:3;width:100%;height:100%;opacity:0;transition:opacity 700ms ease}
.fx-cracks path{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px rgba(255,120,120,.6))}
.fx-cracks .glow{stroke:rgba(255,80,40,.35);stroke-width:4}
.fx-cracks .s3{opacity:0;transition:opacity 700ms ease}
.front.stage-2 .fx-cracks,.front.stage-3 .fx-cracks{opacity:1}
.front.stage-3 .fx-cracks .s3{opacity:1}
.fx-embers{z-index:4;width:100%;height:100%}
.fx-flash{z-index:5;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.85),rgba(255,70,50,.55) 45%,rgba(120,0,0,.2));opacity:0}
.fx-flash.go{animation:flash 380ms ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.front.shake{animation:shake 420ms cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-1px)}}
.stage-tag{margin-left:8px;margin-right:auto;padding:2px 6px;border-radius:5px;font-size:8.5px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,159,28,.22);color:#ffc680;opacity:0;transition:opacity 400ms}
.front.stage-2 .stage-tag,.front.stage-3 .stage-tag{opacity:1}
.front.stage-3 .stage-tag{background:rgba(255,60,60,.28);color:#ff9a9a;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.55}}
/* Fighting-game damage trail: the HP just lost stays white, then drains */
.hud-bottom .hp-track{position:relative}
.hud-bottom .hp-fill{position:relative}
.hp-trail{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:rgba(255,255,255,.85);transition:width 700ms ease 450ms}
.front.stage-3 .hud-bottom .hp-fill{background:linear-gradient(90deg,#ff2d2d,#ff6a3d);animation:blink 1s infinite}
.pop.big{top:38%;z-index:7;font-size:34px}
@media(prefers-reduced-motion:reduce){.front.shake,.front.stage-3 .fx-vignette,.front.stage-3 .fx-flicker,.front.stage-3 .stage-tag,.front.stage-3 .hud-bottom .hp-fill{animation:none}.hp-trail{transition:none}}
@media(prefers-reduced-motion:reduce){.tile.strike,.tile.strike .charge{animation:none}.tile.is-sending::after{animation-duration:3s}.card{transition:none}.hero-video{transition:none}.hp-fill{transition:none}.hit,.row{transition:none}.pop{animation-duration:1ms}}
</style>
</head>
<body>
<div class="scene">
<main class="card" id="card" role="button" tabindex="0" aria-pressed="false" aria-label="Boss card. Tap to show the attack pad and score card.">
<section class="face front" id="front">
<video id="heroVideoA" class="hero-video is-active" autoplay muted playsinline preload="auto"></video>

<div class="fx fx-vignette"></div>

<svg class="fx fx-cracks" viewBox="0 0 390 736" preserveAspectRatio="none" aria-hidden="true">
<g><path class="glow" d="M0 92 L38 104 L61 97 L88 121 L112 118 M61 97 L70 64 L96 48 M38 104 L30 140 L46 171"/><path d="M0 92 L38 104 L61 97 L88 121 L112 118 M61 97 L70 64 L96 48 M38 104 L30 140 L46 171 M88 121 L94 148"/></g>
<g class="s3"><path class="glow" d="M390 520 L352 532 L330 518 L301 540 L276 536 M330 518 L318 488 L292 470 M352 532 L361 566 L346 598"/><path d="M390 520 L352 532 L330 518 L301 540 L276 536 M330 518 L318 488 L292 470 M352 532 L361 566 L346 598 M301 540 L296 566"/><path class="glow" d="M390 250 L366 262 L358 290 L340 302 M366 262 L372 230"/><path d="M390 250 L366 262 L358 290 L340 302 M366 262 L372 230"/><path d="M0 640 L24 628 L44 640 L62 626 M24 628 L20 604"/></g>
</svg>
<canvas class="fx fx-embers" id="embers" aria-hidden="true"></canvas>
<div class="fx fx-flash" id="flash"></div>
<div class="victory" id="victory" hidden>
<div class="v-panel">
<div class="v-kicker" id="vKicker">Boss defeated</div>
<div class="v-title" id="vTitle">Victory</div>
<div class="v-boss" id="vBoss"></div>
<div class="v-stats">
<div class="v-stat"><b id="vDamage">0</b><span>Damage</span></div>
<div class="v-stat"><b id="vHits">0</b><span>Hits</span></div>
<div class="v-stat"><b id="vCrits">0</b><span>Crits</span></div>
<div class="v-stat"><b id="vDays">0</b><span>Days</span></div>
</div>
<div class="v-final" id="vFinal"></div>
<div class="v-orb"></div>
<button class="v-btn" type="button" id="vBtn">Claim victory</button>
<div class="v-note" id="vNote"></div>
</div>
</div>
<div class="hud-top">
<div class="metric"><div class="label">Boss</div><div class="value boss-name" id="bossName">—</div><div class="epithet" id="bossEpithet"></div></div>
<div class="metric right"><div class="label">Level</div><div class="value level-num" id="level">—</div><div class="power-mult" id="powerMult"></div></div>
</div>
<div class="hud-bottom" id="hpHud" hidden>
<div class="hp-head"><span class="label">HP</span><span class="stage-tag" id="stageTag"></span><span class="hp-num" id="hpNum">—</span></div>
<div class="hp-track"><div class="hp-trail" id="hpTrail"></div><div class="hp-fill" id="hpFill"></div></div>
</div>
</section>
<section class="face back" id="back" aria-hidden="true">
<div class="sc-head"><div class="sc-title" id="scBoss">—</div><div class="sc-hp" id="scHp">—</div></div>
<div class="hp-track"><div class="hp-fill" id="scFill"></div></div>
<div class="hero-line" id="heroLine" hidden><span class="label" id="heroName">Hero</span><span class="hero-hp" id="heroHp">—</span></div>
<div class="hp-track hero-track" id="heroTrack" hidden><div class="hp-fill hero-fill" id="heroFill"></div></div>
<div class="tabs" role="tablist">
<button class="tab" type="button" role="tab" id="tabAttack" aria-controls="panelAttack" aria-selected="true">Attack</button>
<button class="tab" type="button" role="tab" id="tabLog" aria-controls="panelLog" aria-selected="false">Log</button>
<button class="tab" type="button" role="tab" id="tabLore" aria-controls="panelLore" aria-selected="false">Lore</button>
<button class="tab" type="button" role="tab" id="tabHall" aria-controls="panelHall" aria-selected="false">Hall</button>
</div>
<div class="panel" id="panelAttack" role="tabpanel" aria-labelledby="tabAttack">
<div class="pad" id="pad">
<div class="power" id="power" hidden></div>
<section class="sec" data-sec="morning" hidden><button class="sec-head" type="button" aria-expanded="true"><span class="label">☀️ Morning</span><span class="sec-count"></span><span class="chev" aria-hidden="true"></span></button><div class="tiles" id="morningTiles"></div></section>
<section class="sec" data-sec="day" hidden><button class="sec-head" type="button" aria-expanded="true"><span class="label">🍽️ Day</span><span class="sec-count"></span><span class="chev" aria-hidden="true"></span></button><div class="tiles" id="dayTiles"></div></section>
<section class="sec" data-sec="evening" hidden><button class="sec-head" type="button" aria-expanded="true"><span class="label">🌙 Evening</span><span class="sec-count"></span><span class="chev" aria-hidden="true"></span></button><div class="tiles" id="eveningTiles"></div></section>
<section class="sec" data-sec="weekly" hidden><button class="sec-head" type="button" aria-expanded="true"><span class="label">🗓️ Weekly</span><span class="sec-count"></span><span class="chev" aria-hidden="true"></span></button><div class="tiles" id="weeklyTiles"></div></section>
<section class="sec" data-sec="bad" hidden><button class="sec-head" type="button" aria-expanded="true"><span class="label">Bad habits</span><span class="sec-count"></span><span class="chev" aria-hidden="true"></span></button><div class="tiles" id="badTiles"></div></section>
<section class="sec" data-sec="workout" hidden><button class="sec-head" type="button" aria-expanded="true"><span class="label">Workouts</span><span class="sec-count"></span><span class="chev" aria-hidden="true"></span></button><div class="tiles" id="workoutTiles"></div></section>
</div>
<div class="hint">Hold to attack · Tap the header to flip</div>
</div>

<div class="stats">
<div class="stat"><div class="stat-num" id="stDamage">0</div><div class="label">Damage</div></div>
<div class="stat"><div class="stat-num" id="stHits">0</div><div class="label">Hits</div></div>
<div class="stat"><div class="stat-num" id="stCrits">0</div><div class="label">Crits</div></div>
<div class="stat"><div class="stat-num" id="stBest">0</div><div class="label">Best hit</div></div>
</div>
<div class="log-head">
<div class="filters" role="group" aria-label="Show hits">
<button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
<button class="chip" type="button" data-filter="boss" aria-pressed="false">Boss</button>
<button class="chip" type="button" data-filter="hero" aria-pressed="false">Me</button>
</div>

</div>

</div>
<div class="panel" id="panelLore" role="tabpanel" aria-labelledby="tabLore" hidden>
<div class="lore">
<div class="lore-epithet" id="loreEpithet"></div>
<div class="lore-name" id="loreName">—</div>
<p class="lore-text" id="loreText"></p>
<div class="lore-facts" id="loreFacts"></div>
</div>
<div class="hint">Tap to flip back</div>
</div>
<div class="panel" id="panelHall" role="tabpanel" aria-labelledby="tabHall" hidden>
<div class="hall">
<div class="hall-sum" id="hallSum"></div>
<ul class="hall-list" id="hallList"></ul>
</div>
<div class="hint">Every boss you beat hangs here</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</section>
</main>
</div>
<script>
// Same-origin (GitHub Pages) rather than raw.githubusercontent: Pages purges
// its CDN on deploy, raw does not. Measured 58s vs >200s to reflect an update.
const STATE_URL = 'data.json';
// Make scenarios 9849975 "Battle — Record Habit Event" and 9852609 "Battle —
// Revert Event". Both check the passcode, so these URLs being public in this
// repo does not let anyone else attack or heal the boss.
const ATTACK_URL = 'https://hook.eu2.make.com/473lvjmuusks2syjve4y2mrco5eye82d';
const REVERT_URL = 'https://hook.eu2.make.com/91jpq9bav3688kr4mt21obvqx63w04x7';
// Make scenario 9867207 "Boss — Claim Victory & Summon Next", passcode-checked
// like the two above. Claiming a combat victory starts Boss Spawn.
const CLAIM_URL = 'https://hook.eu2.make.com/5w5cvi610z5actjsftn78b91peyd1usn';
const STUCK_MS = 21 * 60 * 1000;
const PASSCODE_KEY = 'boss-revert-passcode';
const TAB_KEY = 'boss-tab';
const FILTER_KEY = 'boss-log-filter';
const REFRESH_MS = 15000;
const CROSSFADE_MS = 1200;
const CROSSFADE_LEAD_MS = 60;
const HOLD_MS = 600;
// Pages takes about a minute to serve a new data.json; until then what this
// page just did is shown instead of the stale file.
const PENDING_MS = 180000;
const FRESH_MS = 60000;
const TIME_ZONE = 'Europe/Amsterdam';
// The game day rolls over at 04:00 with the Main Quest run, so a 01:00 snack
// belongs to the day before.
const DAY_START_HOURS = 4;
const videos = [document.getElementById('heroVideoA'), document.getElementById('heroVideoB')];
let activeVideoIndex = 0;
let crossfadeRunning = false;
let crossfadeTimer = null;
const $ = id => document.getElementById(id);
const cardEl = $('card');
const frontEl = $('front');
const backEl = $('back');
const logEl = $('log');
const toastEl = $('toast');
let loadedVideoKey = '';
let flipTimer = null;
let toastTimer = null;
let latestState = null;
let pending = [];
let suppressClick = false;
let openRow = null;
let busy = false;

function setFlipped(flipped) {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const flipMs = reduceMotion ? 0 : parseFloat(getComputedStyle(cardEl).getPropertyValue('--flip-ms')) || 1100;
  closeOpenRow();
  cardEl.classList.toggle('is-flipped', flipped);
  cardEl.setAttribute('aria-pressed', String(flipped));
  cardEl.setAttribute('aria-label', flipped ? 'Attack pad and score card. Tap the header to show the boss.' : 'Boss card. Tap to show the attack pad and score card.');
  frontEl.setAttribute('aria-hidden', String(flipped));
  backEl.setAttribute('aria-hidden', String(!flipped));
  clearTimeout(flipTimer);
  flipTimer = setTimeout(() => cardEl.classList.toggle('show-back', flipped), flipMs / 2);
  if (flipped) { logEl.scrollTop = 0; renderTiles(); }
  else { resumeActiveVideo(); setTimeout(() => { if (latestState) renderDamage(latestState); }, flipMs); }
}
// Browsers pause muted autoplay video while it is hidden (flipped away, or the
// tab in the background) and do not always restart it, which leaves the front black.
function resumeActiveVideo() {
  const active = videos[activeVideoIndex];
  if (!crossfadeRunning && active.currentSrc && active.paused) active.play().catch(() => {});
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!cardEl.classList.contains('is-flipped')) resumeActiveVideo();
  renderTiles();
  refreshDashboard();
});
cardEl.addEventListener('click', event => {
  // A swipe or hold ends in a click on some browsers; an open row closes on the next tap.
  if (suppressClick) { suppressClick = false; return; }
  if (event.target.closest('.row-action, .tile, .tabs, .filters, .v-btn')) return;
  if (openRow) { closeOpenRow(); return; }
  if (busy) return;
  const flipped = cardEl.classList.contains('is-flipped');
  // On the attack pad only the header flips back, so a missed tile tap does not.
  if (flipped && !$('panelAttack').hidden && !event.target.closest('.sc-head, .hp-track, .hero-line, .hint')) return;
  setFlipped(!flipped);
});
cardEl.addEventListener('keydown', event => {
  if (event.target !== cardEl) return;
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    setFlipped(!cardEl.classList.contains('is-flipped'));
  }
});
cardEl.addEventListener('contextmenu', event => event.preventDefault());

const TABS = ['attack', 'log', 'lore', 'hall'];
function showTab(name) {
  const shown = TABS.includes(name) ? name : 'attack';
  for (const tab of TABS) {
    const id = tab[0].toUpperCase() + tab.slice(1);
    $('tab' + id).setAttribute('aria-selected', String(tab === shown));
    $('panel' + id).hidden = tab !== shown;
  }
  closeOpenRow();
  try { localStorage.setItem(TAB_KEY, shown); } catch (_) {}
}
$('tabAttack').addEventListener('click', () => showTab('attack'));
$('tabLog').addEventListener('click', () => showTab('log'));
$('tabLore').addEventListener('click', () => showTab('lore'));
$('tabHall').addEventListener('click', () => showTab('hall'));
try { showTab(localStorage.getItem(TAB_KEY) || 'attack'); } catch (_) { showTab('attack'); }

let logFilter = 'all';
function setFilter(name) {
  logFilter = ['boss', 'hero'].includes(name) ? name : 'all';
  document.querySelectorAll('.chip').forEach(chip => chip.setAttribute('aria-pressed', String(chip.dataset.filter === logFilter)));
  try { localStorage.setItem(FILTER_KEY, logFilter); } catch (_) {}
  if (latestState) renderLog(latestState);
}
document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => setFilter(chip.dataset.filter)));
try { setFilter(localStorage.getItem(FILTER_KEY) || 'all'); } catch (_) { setFilter('all'); }

function showToast(message, isError) {
  toastEl.textContent = message;
  toastEl.classList.toggle('is-error', !!isError);
  toastEl.classList.add('is-shown');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('is-shown'), isError ? 3500 : 4200);
}

function readPasscode() {
  try { return localStorage.getItem(PASSCODE_KEY) || ''; } catch (_) { return ''; }
}
function savePasscode(value) {
  try {
    if (value) localStorage.setItem(PASSCODE_KEY, value);
    else localStorage.removeItem(PASSCODE_KEY);
  } catch (_) {}
}
function askPasscode() {
  return readPasscode() || (window.prompt('Passcode') || '').trim();
}
async function post(url, fields) {
  const response = await fetch(url, { method: 'POST', body: new URLSearchParams(fields) });
  const text = await response.text();
  try { return JSON.parse(text); } catch (_) { throw new Error(text || 'No response'); }
}
function failMessage(error) {
  return error instanceof TypeError ? 'Could not reach Make. Try again.' : error.message;
}

// ---- Time since ----
function since(iso) {
  const t = Date.parse(iso || '');
  if (isNaN(t)) return null;
  const minutes = Math.max(0, Math.floor((Date.now() - t) / 60000));
  if (minutes < 1) return 'now';
  if (minutes < 60) return minutes + 'm';
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + 'h';
  const days = Math.floor(hours / 24);
  if (days < 14) return days + 'd';
  if (days < 60) return Math.floor(days / 7) + 'w';
  return Math.floor(days / 30) + 'mo';
}
function lastDone(habit) {
  const a = Date.parse(habit.last_attack || '');

  hit.addEventListener('pointerup', end);

  row.querySelector('.row-action').addEventListener('click', event => {
    event.stopPropagation();

async function revertRow(row) {
  if (busy || attackQueue.length) return;
  const id = row.dataset.id;
  const passcode = askPasscode();
  if (!passcode) { closeRow(row); return; }
  busy = true;
  openRow = null;
  row.classList.remove('is-open');
  row.classList.add('is-busy');
  row.querySelector('.row-action').textContent = 'Reverting…';
  setOffset(row, -row.getBoundingClientRect().width);
  try {
    const result = await post(REVERT_URL, { event_id: id, passcode });
    if (result.code === 'bad_passcode') savePasscode('');
    if (!result.ok) throw new Error(result.message || 'Revert failed');
    savePasscode(passcode);
    await collapseRow(row);
    busy = false;
    applyLocal(withoutHit(latestState, id, result), [{ kind: 'drop', id }]);
    showToast(result.message);
    sendAttacks();
  } catch (error) {
    busy = false;
    row.classList.remove('is-busy');
    closeRow(row);
    showToast(failMessage(error), true);
    if (latestState) renderState(latestState);
    sendAttacks();
  }
}
// Make answers before it republishes data.json, so the card is updated here
// the same way Make rebuilds the log: boss HP left is a running total from max
// HP, hero HP left stays as recorded.
function withoutHit(state, id, result) {
  const next = Object.assign({}, state);
  const hpAfter = Number(result.hp_after);
  if (result.kind === 'hero') {
    next.hero_hp = hpAfter;
    if (result.hp_max) next.hero_max_hp = Number(result.hp_max);
  } else {
    next.current_hp = hpAfter;
    if (result.hp_max) next.max_hp = Number(result.hp_max);
  }
  const log = (state.log || []).filter(hit => hit.id !== id).map(hit => Object.assign({}, hit));
  let hp = Number(next.max_hp) || 0;
  for (let i = log.length - 1; i >= 0; i--) {
    if (kindOf(log[i]) !== 'boss') continue;
    hp = Math.max(0, hp - (Number(log[i].damage) || 0));
    log[i].hp_after = hp;
  }
  next.log = log;
  return next;
}
function closeRow(row) {
  row.classList.remove('is-open', 'is-busy');
  row.querySelector('.row-action').textContent = 'Revert';
  setOffset(row, 0);
}
function collapseRow(row) {
  return new Promise(resolve => {
    row.style.height = row.offsetHeight + 'px';
    requestAnimationFrame(() => {
      row.classList.add('is-gone');
      row.style.height = '0px';
      setTimeout(resolve, 280);
    });
  });
}

const whenFormat = new Intl.DateTimeFormat('en-GB', { timeZone: TIME_ZONE, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
function formatWhen(iso) {
  const date = new Date(iso);
  return isNaN(date.getTime()) ? '' : whenFormat.format(date).replace(',', ' ·');
}

const dayKeyFormat = new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit' });
const dayLabelFormat = new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' });

  return dayKeyFormat.format(new Date(ms - DAY_START_HOURS * 3600000));
}
// The Monday that starts this game day's week.
function weekKey(ms) {
  const day = Date.parse(dayKey(ms) + 'T12:00:00Z');

}
function dayLabel(key) {

  if (key === dayKey(Date.now() - 86400000)) return 'Yesterday';

}
function kindOf(hit) {

}

function renderLog(state) {
  const all = Array.isArray(state.log) ? state.log : [];
  // The four totals describe the fight, so they only count hits on the boss.
  const bossHits = all.filter(hit => kindOf(hit) === 'boss');
  const damages = bossHits.map(hit => Number(hit.damage) || 0);
  $('stDamage').textContent = damages.reduce((a, b) => a + b, 0).toLocaleString();
  $('stHits').textContent = bossHits.length.toLocaleString();
  $('stCrits').textContent = bossHits.filter(hit => Number(hit.crit) === 1).length.toLocaleString();
  $('stBest').textContent = (damages.length ? Math.max(...damages) : 0).toLocaleString();

  const log = logFilter === 'all' ? all : all.filter(hit => kindOf(hit) === logFilter);
  $('logCount').textContent = log.length ? log.length + (log.length === 1 ? ' hit' : ' hits') : '';

  openRow = null;
  logEl.replaceChildren();
  if (!log.length) {
    const empty = document.createElement('li');
    empty.className = 'empty';
    empty.textContent = logFilter === 'hero' ? 'Nothing has hit you this fight.' : 'No hits yet. Go land one.';
    logEl.append(empty);
    return;
  }
  // The log arrives newest first, so each day's hits are already together.
  const days = [];
  for (const hit of log) {
    const t = Date.parse(hit.at);
    const key = isNaN(t) ? '' : dayKey(t);
    if (!days.length || days[days.length - 1].key !== key) days.push({ key, hits: [] });
    days[days.length - 1].hits.push(hit);
  }
  for (const day of days) {
    logEl.append(buildDayHeader(day));
    for (const hit of day.hits) appendHitRow(hit);
  }
}
function buildDayHeader(day) {

  const sum = document.createElement('span');
  sum.className = 'day-sum';
  const total = kind => day.hits.filter(hit => kindOf(hit) === kind).reduce((a, hit) => a + (Number(hit.damage) || 0), 0);
  const boss = total('boss');
  const hero = total('hero');
  if (boss) sum.append('−' + boss + ' boss');
  if (boss && hero) sum.append(' · ');
  if (hero) {
    const you = document.createElement('span');
    you.className = 'you';
    you.textContent = '−' + hero + ' you';
    sum.append(you);

}
function appendHitRow(hit) {

  }
  const when = document.createElement('div');

  const boosts = [];
  if (hit.special) boosts.push(hit.special);
  if (hit.effort) boosts.push('×' + hit.effort + ' effort');
  if (hit.form_bonus) boosts.push('+' + Math.round((hit.form_bonus - 1) * 100) + '% form');
  if (hit.streak) boosts.push('🔥' + hit.streak + '-day +' + streakBonus(hit.streak) + '%');
  when.textContent = formatWhen(hit.at) + (boosts.length ? ' · ' + boosts.join(' · ') : '');

function resetCrossfadeState() {
  crossfadeRunning = false;
  clearTimeout(crossfadeTimer);
  crossfadeTimer = null;
  activeVideoIndex = 0;
  videos.forEach((video, index) => {
    video.pause();
    try { video.currentTime = 0; } catch (_) {}
    video.classList.toggle('is-active', index === 0);
    video.style.zIndex = '0';
  });
}
function loadVideoPair(videoUrl) {
  resetCrossfadeState();
  videos.forEach(video => {
    video.removeAttribute('src');
    video.load();
    video.src = videoUrl;
    video.load();
  });
  const first = videos[0];
  const startPlayback = () => first.play().catch(() => {});
  if (first.readyState >= 2) startPlayback();
  else first.addEventListener('canplay', startPlayback, { once: true });
}
function startCrossfade() {
  if (crossfadeRunning) return;
  const outgoing = videos[activeVideoIndex];
  const incomingIndex = 1 - activeVideoIndex;
  const incoming = videos[incomingIndex];
  if (!Number.isFinite(outgoing.duration) || outgoing.duration <= 0) return;
  crossfadeRunning = true;
  incoming.pause();
  try { incoming.currentTime = 0; } catch (_) {}
  incoming.classList.remove('is-active');
  outgoing.classList.add('is-active');
  outgoing.style.zIndex = '0';
  incoming.style.zIndex = '1';
  const beginFade = () => {
    incoming.play().then(() => {
      requestAnimationFrame(() => { incoming.classList.add('is-active'); });
      crossfadeTimer = setTimeout(() => {
        outgoing.classList.remove('is-active');
        outgoing.pause();
        try { outgoing.currentTime = 0; } catch (_) {}
        incoming.style.zIndex = '0';
        outgoing.style.zIndex = '0';
        activeVideoIndex = incomingIndex;
        crossfadeRunning = false;
        crossfadeTimer = null;
      }, CROSSFADE_MS + 40);
    }).catch(() => {
      incoming.style.zIndex = '0';
      crossfadeRunning = false;
    });
  };
  if (incoming.readyState >= 2) beginFade();
  else incoming.addEventListener('canplay', beginFade, { once: true });
}

  const active = videos[activeVideoIndex];
  if (!crossfadeRunning && active.readyState >= 2 && Number.isFinite(active.duration) && active.duration > 0) {
    const remainingMs = (active.duration - active.currentTime) * 1000;
    if (active.currentTime > 0 && remainingMs <= CROSSFADE_MS + CROSSFADE_LEAD_MS) startCrossfade();
  }
  requestAnimationFrame(monitorVideoLoop);
}
async function refreshDashboard() {

  try {
    const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) return;
    const fetched = await response.json();
    if (busy || attackQueue.length) return;
    const state = pickState(fetched);
    latestState = state;
    // Re-rendering mid-swipe or mid-hold would pull the row or tile out from under the finger.
    if (!busy && !attackQueue.length && !openRow && !document.querySelector('.is-swiping, .is-charging')) renderState(state);
    const videoUrl = state.video_url || '';
    const videoKey = String(state.video_public_id || state.video_version || videoUrl);
    if (videoUrl && videoKey !== loadedVideoKey) {
      loadedVideoKey = videoKey;
      loadVideoPair(videoUrl);
    }
  } catch (error) {
    console.error('Boss dashboard refresh failed', error);
  }
}

// ---- Victory ----
// A combat defeat covers the front with a victory screen until it is claimed.

function renderVictory(state) {
  const won = state.status === 'Defeated' && state.defeat_reason === 'Defeated in Combat';
  frontEl.classList.toggle('won', won);
  const el = $('victory');
  if (!won) { el.hidden = true; return; }
  const summoning = !!state.victory_claimed_at;
  // The claim scenario accepts a new claim 20 minutes after the last one; a
  // minute more keeps a slow phone clock from hitting 'already on its way'.
  const stuck = summoning && Date.now() - Date.parse(state.victory_claimed_at) > STUCK_MS;
  el.hidden = false;
  el.classList.toggle('summoning', summoning);
  el.classList.toggle('stuck', stuck);
  $('vKicker').textContent = stuck ? 'Still summoning' : summoning ? 'Victory claimed' : 'Boss defeated';
  $('vTitle').textContent = summoning ? 'A new challenger approaches' : 'Victory';
  $('vBoss').textContent = stuck ? 'The next boss is taking much longer than usual. Generating it probably failed.'
    : summoning ? 'Summoning the next boss. This takes a few minutes.' : (state.boss_name || 'The boss') + ' has fallen';
  $('vBtn').dataset.label = stuck ? 'Try summoning again' : 'Claim victory';
  if (!claimBusy) $('vBtn').textContent = $('vBtn').dataset.label;
  const hits = (Array.isArray(state.log) ? state.log : []).filter(hit => kindOf(hit) === 'boss');
  $('vDamage').textContent = hits.reduce((a, hit) => a + (Number(hit.damage) || 0), 0).toLocaleString();

  const start = Date.parse(state.started_at || (hits.length ? hits[hits.length - 1].at : ''));
  const end = Date.parse(state.defeated_at || (hits.length ? hits[0].at : ''));
  $('vDays').textContent = !isNaN(start) && !isNaN(end) ? String(Math.max(1, Math.ceil((end - start) / 86400000))) : '—';
  const last = hits[0];

  if (!claimBusy) $('vNote').textContent = stuck ? 'Or wait: the 04:45 run retries by itself.'
    : summoning ? 'This card updates by itself when it arrives.' : 'Claiming summons the next challenger.';

  $('power').hidden = false;

// Hall of Fame: one trophy per boss beaten in combat (Claim Victory writes the

const hallDate = new Intl.DateTimeFormat('en-GB', { timeZone: TIME_ZONE, day: 'numeric', month: 'short' });

// ---- Damage overlay ----
// The front gets more battered as the boss's HP drops. HP lost since this
// device last saw the front plays as a hit: shake, flash, damage number and a
// white trail on the HP bar. A new fight or a revert just resets what was seen.
const SEEN_KEY = 'boss-seen-hp';

let damageStage = 1;
function stageOf(pct) { return pct <= 25 ? 3 : pct <= 60 ? 2 : 1; }
function readSeen() {
  try { return JSON.parse(localStorage.getItem(SEEN_KEY) || 'null'); } catch (_) { return null; }
}
function writeSeen(fightId, hp) {
  try { localStorage.setItem(SEEN_KEY, JSON.stringify({ fight: fightId, hp })); } catch (_) {}
}
function renderDamage(state) {
  const cur = Number(state.current_hp), max = Number(state.max_hp);
  const known = state.current_hp != null && max > 0;
  const pct = known ? Math.max(0, Math.min(100, cur / max * 100)) : 100;
  damageStage = known ? stageOf(pct) : 1;
  frontEl.style.setProperty('--d', known ? (1 - pct / 100).toFixed(3) : '0');
  frontEl.classList.toggle('stage-2', damageStage === 2);
  frontEl.classList.toggle('stage-3', damageStage === 3);
  $('stageTag').textContent = damageStage === 3 ? 'On the ropes' : damageStage === 2 ? 'Battle-worn' : '';
  const trail = $('hpTrail');
  if (!known) { trail.style.width = '0%'; return; }
  // Only play the hit where it can be seen; the back keeps it for later.
  const frontShown = !cardEl.classList.contains('is-flipped') && document.visibilityState === 'visible';
  const fight = String(state.fight_id || state.boss_name || '');
  const seen = readSeen();
  if (!frontShown) {
    if (!seen || seen.fight !== fight) trail.style.width = pct + '%';
    return;
  }
  if (seen && seen.fight === fight && cur < seen.hp) {
    trail.style.transition = 'none';
    trail.style.width = Math.min(100, seen.hp / max * 100) + '%';
    void trail.offsetWidth;
    trail.style.transition = '';
    trail.style.width = pct + '%';
    playHit(Math.round(seen.hp - cur));
  } else {
    trail.style.width = pct + '%';
  }
  writeSeen(fight, cur);
  startEmbers();
}
function playHit(damage) {
  if (!reduceMotion()) {
    frontEl.classList.remove('shake'); void frontEl.offsetWidth; frontEl.classList.add('shake');
    const flash = $('flash');
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  }
  const pop = document.createElement('div');
  pop.className = 'pop big';
  pop.textContent = '−' + damage.toLocaleString();
  frontEl.append(pop);
  setTimeout(() => pop.remove(), 1200);
}
frontEl.addEventListener('animationend', event => { if (event.animationName === 'shake') frontEl.classList.remove('shake'); });

// Embers: a few sparks when battle-worn, a steady rise when on the ropes.
const embersCanvas = $('embers');
const embersCtx = embersCanvas.getContext('2d');
const embers = [];
let embersRunning = false;
function sizeEmbers() {
  const rect = frontEl.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  embersCanvas.width = Math.round(rect.width * dpr);
  embersCanvas.height = Math.round(rect.height * dpr);
  embersCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
if (window.ResizeObserver) new ResizeObserver(sizeEmbers).observe(frontEl); else sizeEmbers();
function startEmbers() {
  if (embersRunning || damageStage < 2 || reduceMotion()) return;
  embersRunning = true;
  requestAnimationFrame(tickEmbers);
}
function tickEmbers() {
  const dpr = window.devicePixelRatio || 1;
  const w = embersCanvas.width / dpr, h = embersCanvas.height / dpr;
  const idle = document.visibilityState !== 'visible' || cardEl.classList.contains('is-flipped');
  const rate = idle ? 0 : damageStage === 3 ? .45 : damageStage === 2 ? .06 : 0;
  if (Math.random() < rate) embers.push({ x: Math.random() * w, y: h + 4, vx: (Math.random() - .5) * .5, vy: -(.6 + Math.random() * 1.2), life: 1, r: .8 + Math.random() * 1.8 });
  embersCtx.clearRect(0, 0, w, h);
  embersCtx.shadowColor = 'rgba(255,90,30,.9)';
  embersCtx.shadowBlur = 8;
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.x += e.vx + Math.sin(e.y / 30) * .25; e.y += e.vy; e.life -= .006;
    if (e.life <= 0 || e.y < -10) { embers.splice(i, 1); continue; }
    embersCtx.beginPath();
    embersCtx.fillStyle = `rgba(255,${120 + Math.floor(e.life * 90)},60,${e.life * .9})`;
    embersCtx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    embersCtx.fill();
  }
  // Stop drawing once nothing is left to show; renderDamage restarts it.
  if (rate === 0 && !embers.length) { embersRunning = false; return; }
  requestAnimationFrame(tickEmbers);
}

monitorVideoLoop();
refreshDashboard();
setInterval(refreshDashboard, REFRESH_MS);
</script>
